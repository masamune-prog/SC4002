[project]
name = "sc4002-ensemble"
version = "0.1.0"
description = "SC4002 Stage-2 mixed-architecture joint intent + slot ensemble on MASSIVE en-US"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.5,<3.10",
    "nbclient",
    "nbformat",
    "numpy",
    "pandas>=2.0,<3.0",
    "torch",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
